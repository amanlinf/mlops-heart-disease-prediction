name: heart disease prediction ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-train-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint source code
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v

      - name: Fetch and prepare UCI dataset
        run: python -m src.data

      - name: Generate EDA outputs
        run: python -m src.eda

      - name: Prepare MLflow tracking directory
        run: |
          rm -rf ./mlruns
          rm -rf ./artifacts
          rm -rf ./plots/evaluation

          mkdir -p ./mlruns
          mkdir -p ./artifacts
          mkdir -p ./plots/evaluation

      - name: Train candidate models and track experiments
        env:
          MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
        run: |
          python -m src.train

      - name: Verifying training artifacts created successfully
        run: |
          test -f artifacts/model.joblib
          test -f artifacts/metadata.json
          test -f plots/evaluation/confusion_matrix.png
          test -f plots/evaluation/roc_curve.png

      - name: Build Docker image
        run: docker build --tag heart-predictor:ci .

      - name: Test Sample api run on live docker container
        run: |
          docker run --rm -d --name heart-predictor-ci -p 127.0.0.1:8000:8000 heart-predictor:ci
          python scripts/sample_api_prediction.py

      - name: API logs from docker container
        if: always()
        run: docker logs heart-predictor-ci || true

      - name: Stop docker container
        if: always()
        run: docker stop heart-predictor-ci || true
