name: heart disease prediction ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-train-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint source code
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v

      - name: Fetch and prepare UCI dataset
        run: python -m src.data

      - name: Generate EDA outputs
        run: python -m src.eda

      - name: Prepare MLflow tracking directory
        run: |
          rm -rf ./mlruns
          mkdir -p ./mlruns
      - name: Train candidate models and track experiments
        env:
          MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
        run: |
          python -m src.train
