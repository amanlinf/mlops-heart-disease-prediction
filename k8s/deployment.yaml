# using local kubernetes minikube setup
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-pedictor-api
  labels:
    app: heart-pedictor-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-pedictor-api
  template:
    metadata:
      labels:
        app: heart-pedictor-api
    spec:
      containers:
        - name: heart-pedictor-api
          image: heart-predictor:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/artifacts/model.joblib
            - name: METADATA_PATH
              value: /app/artifacts/metadata.json
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
